name: Update package commit metadata

on:
  push:

permissions:
  contents: write

concurrency:
  group: package-metadata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: initialize package commit metadata') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update package.json
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"
          python3 .github/scripts/update-package-metadata.py "$SOURCE_SHA"
          if ! git diff --quiet -- package.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package.json
            git commit -m 'chore: update package commit metadata'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
